openapi: 3.1.0
info:
  title: ReactorFront Document Intelligence API
  version: 0.1.0
  description: >-
    Canonical synchronous contract for authenticated document classification
    and review increments.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000
    description: Local Compose environment
security:
  - bearerAuth: []
tags:
  - name: Documents
    description: Document submission and processing status.
  - name: Reviews
    description: Immutable terminal human classification review.
  - name: Audit
    description: Append-only sanitized product audit history.
  - name: Operations
    description: Process health and dependency readiness.
paths:
  /api/v1/documents:
    post:
      tags:
        - Documents
      summary: Submit a PDF for classification
      operationId: createDocument
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: application/pdf
      responses:
        "202":
          description: The document and processing job were accepted.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentAccepted"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/InsufficientCapability"
        "400":
          $ref: "#/components/responses/InvalidDocument"
        "413":
          $ref: "#/components/responses/DocumentTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/documents/{documentId}:
    get:
      tags:
        - Documents
      summary: Get document processing status
      operationId: getDocument
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current document and processing state.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStatus"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/InsufficientCapability"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/documents/{documentId}/source:
    get:
      tags:
        - Documents
      summary: Get an owned document's private PDF source
      operationId: getDocumentSource
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The verified private PDF source.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Content-Disposition:
              description: Sanitized inline source filename.
              schema:
                type: string
                const: 'inline; filename="source.pdf"'
            Content-Length:
              description: Verified source size in bytes.
              schema:
                type: integer
                minimum: 1
                maximum: 5242880
            ETag:
              description: Strong entity tag derived from the persisted SHA-256 digest.
              schema:
                type: string
                pattern: '^"[a-f0-9]{64}"$'
            X-Content-Type-Options:
              description: Disables content-type sniffing.
              schema:
                type: string
                const: nosniff
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/InsufficientCapability"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/SourceAccessUnavailable"
  /api/v1/documents/{documentId}/review:
    get:
      tags:
        - Reviews
      summary: Get the current review representation
      operationId: getDocumentReview
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current immutable machine evidence and human-review state.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            ETag:
              $ref: "#/components/headers/ReviewEntityTag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/InsufficientCapability"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "409":
          $ref: "#/components/responses/ReviewNotAvailable"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
    put:
      tags:
        - Reviews
      summary: Commit one terminal approval or correction
      operationId: putDocumentReview
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: The committed terminal decision or its identical replay.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            ETag:
              $ref: "#/components/headers/ReviewEntityTag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalReview"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/InsufficientCapability"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "409":
          $ref: "#/components/responses/ReviewWriteConflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/documents/{documentId}/audit-events:
    get:
      tags:
        - Audit
      summary: Get the owned document's sanitized audit history
      operationId: getDocumentAuditEvents
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Deterministically ordered append-only product audit events.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditHistory"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/InsufficientCapability"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /health:
    get:
      security: []
      tags:
        - Operations
      summary: Check whether the API process is running
      operationId: getHealth
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /ready:
    get:
      security: []
      tags:
        - Operations
      summary: Check whether the API can accept useful work
      operationId: getReadiness
      responses:
        "200":
          description: Required runtime dependencies are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        OAuth access token validated independently by the API. Document
        operations require a capability and matching resource ownership.
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      description: Server-generated document identifier.
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional caller-provided identifier used for traceability.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Latest strong review entity tag; omission returns 428.
      schema:
        type: string
        pattern: '^"[a-f0-9]{64}"$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID scoped to the authenticated principal and review operation.
      schema:
        type: string
        format: uuid
  headers:
    CorrelationId:
      description: Correlation identifier assigned to this request flow.
      schema:
        type: string
        format: uuid
    BearerChallenge:
      description: Sanitized OAuth bearer-token challenge.
      schema:
        type: string
        pattern: '^Bearer realm="reactorfront-api"$'
    ReviewEntityTag:
      description: Opaque strong entity tag for the returned review version.
      schema:
        type: string
        pattern: '^"[a-f0-9]{64}"$'
  responses:
    AuthenticationRequired:
      description: A missing or invalid bearer access token.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
        WWW-Authenticate:
          $ref: "#/components/headers/BearerChallenge"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/AuthenticationRequiredProblem"
    InsufficientCapability:
      description: The authenticated principal lacks the required capability.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/InsufficientCapabilityProblem"
    InvalidRequest:
      description: A path, header, or request-body value violates the API contract.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/InvalidRequestProblem"
    InvalidDocument:
      description: The submitted file is not a supported PDF.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/InvalidDocumentProblem"
    DocumentTooLarge:
      description: The submitted file exceeds the 5 MiB limit.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DocumentTooLargeProblem"
    UnsupportedMediaType:
      description: The request does not contain an application/pdf file.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/UnsupportedMediaTypeProblem"
    DocumentNotFound:
      description: No document exists for the supplied identifier.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DocumentNotFoundProblem"
    DependencyUnavailable:
      description: At least one required dependency is unavailable.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DependencyUnavailableProblem"
    SourceAccessUnavailable:
      description: Source storage or source integrity is temporarily unavailable.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/SourceUnavailableProblem"
              - $ref: "#/components/schemas/DependencyUnavailableProblem"
    ReviewNotAvailable:
      description: The document has no completed machine result available for review.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ReviewNotAvailableProblem"
    ReviewWriteConflict:
      description: The review is terminal or the idempotency key conflicts.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ReviewNotAvailableProblem"
              - $ref: "#/components/schemas/IdempotencyConflictProblem"
    PreconditionFailed:
      description: The supplied review entity tag is stale or does not match.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PreconditionFailedProblem"
    PreconditionRequired:
      description: The required review If-Match header is absent.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PreconditionRequiredProblem"
  schemas:
    Classification:
      type: string
      enum:
        - invoice
        - report
    DocumentAccepted:
      type: object
      additionalProperties: false
      required:
        - documentId
        - jobId
        - status
      properties:
        documentId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        status:
          type: string
          const: accepted
    DocumentStatus:
      oneOf:
        - $ref: "#/components/schemas/AcceptedDocumentStatus"
        - $ref: "#/components/schemas/QueuedDocumentStatus"
        - $ref: "#/components/schemas/ProcessingDocumentStatus"
        - $ref: "#/components/schemas/CompletedDocumentStatus"
        - $ref: "#/components/schemas/FailedDocumentStatus"
      discriminator:
        propertyName: status
        mapping:
          accepted: "#/components/schemas/AcceptedDocumentStatus"
          queued: "#/components/schemas/QueuedDocumentStatus"
          processing: "#/components/schemas/ProcessingDocumentStatus"
          completed: "#/components/schemas/CompletedDocumentStatus"
          failed: "#/components/schemas/FailedDocumentStatus"
    AcceptedDocumentStatus:
      type: object
      additionalProperties: false
      required:
        - documentId
        - jobId
        - status
        - createdAt
      properties:
        documentId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        status:
          type: string
          const: accepted
        createdAt:
          type: string
          format: date-time
    QueuedDocumentStatus:
      type: object
      additionalProperties: false
      required:
        - documentId
        - jobId
        - status
        - createdAt
      properties:
        documentId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        status:
          type: string
          const: queued
        createdAt:
          type: string
          format: date-time
    ProcessingDocumentStatus:
      type: object
      additionalProperties: false
      required:
        - documentId
        - jobId
        - status
        - createdAt
        - startedAt
      properties:
        documentId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        status:
          type: string
          const: processing
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
    ModelEvidence:
      oneOf:
        - $ref: "#/components/schemas/LegacyModelEvidence"
        - $ref: "#/components/schemas/MeasuredModelEvidence"
      discriminator:
        propertyName: status
        mapping:
          legacy-unmeasured: "#/components/schemas/LegacyModelEvidence"
          measured: "#/components/schemas/MeasuredModelEvidence"
    LegacyModelEvidence:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: legacy-unmeasured
    MeasuredModelEvidence:
      type: object
      additionalProperties: false
      required:
        - status
        - datasetVersion
        - datasetSha256
        - preprocessingVersion
        - pipelineVersion
        - artifactSha256
        - evaluationPolicyVersion
        - evaluationPolicySha256
        - evaluationReportSha256
      properties:
        status:
          type: string
          const: measured
        datasetVersion:
          type: string
          minLength: 1
          maxLength: 128
        datasetSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        preprocessingVersion:
          type: string
          minLength: 1
          maxLength: 128
        pipelineVersion:
          type: string
          minLength: 1
          maxLength: 128
        artifactSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        evaluationPolicyVersion:
          type: string
          minLength: 1
          maxLength: 128
        evaluationPolicySha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        evaluationReportSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    CompletedDocumentStatus:
      type: object
      additionalProperties: false
      required:
        - documentId
        - jobId
        - status
        - classification
        - confidence
        - modelVersion
        - modelEvidence
        - createdAt
        - startedAt
        - completedAt
      properties:
        documentId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        status:
          type: string
          const: completed
        classification:
          $ref: "#/components/schemas/Classification"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        modelVersion:
          type: string
          minLength: 1
          maxLength: 128
        modelEvidence:
          $ref: "#/components/schemas/ModelEvidence"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    FailedDocumentStatus:
      type: object
      additionalProperties: false
      required:
        - documentId
        - jobId
        - status
        - failureCode
        - createdAt
        - completedAt
      properties:
        documentId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        status:
          type: string
          const: failed
        failureCode:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          maxLength: 128
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      required:
        - finalClassification
      properties:
        finalClassification:
          $ref: "#/components/schemas/Classification"
    Review:
      oneOf:
        - $ref: "#/components/schemas/UnreviewedReview"
        - $ref: "#/components/schemas/ApprovedReview"
        - $ref: "#/components/schemas/CorrectedReview"
      discriminator:
        propertyName: status
        mapping:
          unreviewed: "#/components/schemas/UnreviewedReview"
          approved: "#/components/schemas/ApprovedReview"
          corrected: "#/components/schemas/CorrectedReview"
    UnreviewedReview:
      type: object
      additionalProperties: false
      required:
        - documentId
        - jobId
        - status
        - machineClassification
        - machineConfidence
        - modelVersion
        - modelEvidence
        - reviewVersion
      properties:
        documentId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        status:
          type: string
          const: unreviewed
        machineClassification:
          $ref: "#/components/schemas/Classification"
        machineConfidence:
          type: number
          minimum: 0
          maximum: 1
        modelVersion:
          type: string
          minLength: 1
          maxLength: 128
        modelEvidence:
          $ref: "#/components/schemas/ModelEvidence"
        reviewVersion:
          type: integer
          const: 0
    TerminalReview:
      oneOf:
        - $ref: "#/components/schemas/ApprovedReview"
        - $ref: "#/components/schemas/CorrectedReview"
      discriminator:
        propertyName: status
        mapping:
          approved: "#/components/schemas/ApprovedReview"
          corrected: "#/components/schemas/CorrectedReview"
    ApprovedReview:
      type: object
      additionalProperties: false
      required:
        - documentId
        - jobId
        - status
        - machineClassification
        - machineConfidence
        - modelVersion
        - modelEvidence
        - reviewVersion
        - finalClassification
        - reviewerPrincipalId
        - decidedAt
      properties:
        documentId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        status:
          type: string
          const: approved
        machineClassification:
          $ref: "#/components/schemas/Classification"
        machineConfidence:
          type: number
          minimum: 0
          maximum: 1
        modelVersion:
          type: string
          minLength: 1
          maxLength: 128
        modelEvidence:
          $ref: "#/components/schemas/ModelEvidence"
        reviewVersion:
          type: integer
          const: 1
        finalClassification:
          $ref: "#/components/schemas/Classification"
        reviewerPrincipalId:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time
      oneOf:
        - required:
            - machineClassification
            - finalClassification
          properties:
            machineClassification:
              const: invoice
            finalClassification:
              const: invoice
        - required:
            - machineClassification
            - finalClassification
          properties:
            machineClassification:
              const: report
            finalClassification:
              const: report
    CorrectedReview:
      type: object
      additionalProperties: false
      required:
        - documentId
        - jobId
        - status
        - machineClassification
        - machineConfidence
        - modelVersion
        - modelEvidence
        - reviewVersion
        - finalClassification
        - reviewerPrincipalId
        - decidedAt
      properties:
        documentId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        status:
          type: string
          const: corrected
        machineClassification:
          $ref: "#/components/schemas/Classification"
        machineConfidence:
          type: number
          minimum: 0
          maximum: 1
        modelVersion:
          type: string
          minLength: 1
          maxLength: 128
        modelEvidence:
          $ref: "#/components/schemas/ModelEvidence"
        reviewVersion:
          type: integer
          const: 1
        finalClassification:
          $ref: "#/components/schemas/Classification"
        reviewerPrincipalId:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time
      oneOf:
        - required:
            - machineClassification
            - finalClassification
          properties:
            machineClassification:
              const: invoice
            finalClassification:
              const: report
        - required:
            - machineClassification
            - finalClassification
          properties:
            machineClassification:
              const: report
            finalClassification:
              const: invoice
    AuditHistory:
      type: object
      additionalProperties: false
      required:
        - documentId
        - events
      properties:
        documentId:
          type: string
          format: uuid
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - eventId
        - action
        - occurredAt
        - actorPrincipalId
        - documentId
        - jobId
        - correlationId
        - detailsVersion
        - details
      allOf:
        - if:
            required:
              - detailsVersion
            properties:
              detailsVersion:
                const: 1
          then:
            properties:
              details:
                $ref: "#/components/schemas/AuditDetailsV1"
        - if:
            required:
              - detailsVersion
            properties:
              detailsVersion:
                const: 2
          then:
            properties:
              action:
                const: processing.completed
              details:
                $ref: "#/components/schemas/MeasuredProcessingAuditDetailsV2"
      properties:
        eventId:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - document.submitted
            - processing.completed
            - processing.failed
            - review.approved
            - review.corrected
        occurredAt:
          type: string
          format: date-time
        actorPrincipalId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        reviewId:
          type: string
          format: uuid
        correlationId:
          type: string
          format: uuid
        detailsVersion:
          type: integer
          enum:
            - 1
            - 2
        details:
          oneOf:
            - $ref: "#/components/schemas/AuditDetailsV1"
            - $ref: "#/components/schemas/MeasuredProcessingAuditDetailsV2"
