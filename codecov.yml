codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: 90..100
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        if_ci_failed: error

comment: false

fixes:
  - "src/::apps/web/src/"

flags:
  web:
    paths:
      - apps/web/src/
    carryforward: true
  api:
    paths:
      - apps/api/src/
    carryforward: true
  ml:
    paths:
      - apps/ml/src/
    carryforward: true
